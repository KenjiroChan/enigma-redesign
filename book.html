<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Book a room — Enigma redesign concept</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0D0B12}
a{color:#C4B0FF}a:hover{color:#DDD1FF}
*{box-sizing:border-box}
.mono{font-family:'IBM Plex Mono',monospace}
.disp{font-family:'Big Shoulders Display','Oswald',sans-serif;font-weight:800;text-transform:uppercase}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#A79FBA}
.key{cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.key.on{border:1px solid #C9B3FF;background:#C9B3FF;color:#120A24;font-weight:600;box-shadow:0 0 20px rgba(150,110,255,.35)}
.key.off{border:1px solid #372F47;background:#1F1A29;color:#F1ECF8;font-weight:500}
.day{width:62px;min-height:64px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.day b{font:800 24px 'Big Shoulders Display','Oswald',sans-serif}
.chip{min-height:48px;padding:0 16px;border-radius:6px;font-size:15px}
.lamp{width:74px;height:74px;border-radius:50%;font-size:14px;line-height:1.15;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.lamp.off{border:2px solid #4A4060;background:#1F1A29;color:#F1ECF8;box-shadow:inset 0 -4px 0 #120F18}
.lamp.on{border:2px solid #EFE7FF;background:#C9B3FF;color:#120A24;font-weight:600;box-shadow:0 0 26px rgba(150,110,255,.55)}
.btn{min-height:56px;padding:0 30px;border:0;border-radius:8px;background:#7445F5;color:#fff;font:600 17px 'IBM Plex Sans',sans-serif;cursor:pointer;box-shadow:inset 0 -4px 0 #4A25B8;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
input[type=text],input[type=tel],input[type=email]{min-height:50px;padding:0 14px;border-radius:8px;border:1px solid #4A4060;background:#16131D;color:#F1ECF8;font:17px 'IBM Plex Sans',sans-serif}
:focus-visible{outline:3px solid #C9B3FF;outline-offset:2px}
@media (max-width:720px){h1{font-size:40px !important}.wrap{padding:24px 18px !important}}
</style>
</head>
<body>
<div role="note" style="background: #C9B3FF; color: #120A24; font: 500 14px/1.45 'IBM Plex Sans', sans-serif; padding: 10px 20px; text-align: center">Concept redesign by Kenjiro Chan for a UX portfolio. This is not the official Enigma Escape Room website and nothing here can be booked. To book a real game, visit <a href="https://www.enigmaroom.ca" style="color: #120A24; font-weight: 600">enigmaroom.ca</a>.</div>
<div style="background: #0D0B12; color: #F1ECF8; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh">
<header style="border-bottom: 1px solid #2A2436">
<div style="max-width: 1280px; margin: 0 auto; padding: 14px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" aria-label="Enigma, home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F1ECF8"><svg aria-hidden="true" width="24" height="30" viewBox="0 0 30 36" style="fill: #A685FF"><circle cx="15" cy="12" r="9"></circle><path d="M10 18 L20 18 L23 34 L7 34 Z"></path><circle cx="15" cy="12" r="3.2" style="fill: #0D0B12"></circle></svg><span class="disp" style="letter-spacing: 0.16em; font-size: 22px">ENIGMA</span></a>
<ol id="steps" aria-label="Booking steps" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 14px 26px; font-size: 15px; font-weight: 500"></ol>
<span class="mono" style="font-size: 12px; letter-spacing: 0.1em; color: #A79FBA">PROTOTYPE · SAMPLE TIMES</span>
</div>
</header>
<div class="wrap" style="max-width: 1280px; margin: 0 auto; padding: 32px 40px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<main id="main" style="flex: 999 1 640px; min-width: 0"></main>
<aside id="aside" aria-label="Booking summary" style="flex: 1 1 300px; min-width: 260px; background: #16131D; border: 1px solid #372F47; border-radius: 12px; overflow: hidden"></aside>
</div>
</div>
<script>
const DAYS=[['Sun',15],['Mon',16],['Tue',17],['Wed',18],['Thu',19],['Fri',20],['Sat',21]];
const TIMES=['11:30 am','12:45 pm','2:00 pm','3:15 pm','4:30 pm','5:45 pm','7:00 pm','8:15 pm','9:30 pm','10:45 pm'];
const V={adv:['I','NOT SCARY','#15241B','#8FC7A4'],dark:['II','SCARY','#2A1612','#EE7F68'],cube:['III','CUBE','#151C26','#9DB8D9']};
const W={3:'Medium',4:'Hard',5:'Expert'};
const ROOMS=[['01','Jungle Safari','adv',5,2,10],['02','The Lost Treasure','adv',3,2,10],['03','Godfather','adv',4,2,10],['04','Haunted Toy Store','dark',3,2,9],['05','Hannibal','dark',5,2,9],['06','Exorcist','dark',4,2,10],['07','Bomb Squad','cube',5,2,3],['08','Fairytale','cube',4,2,7],['09','Magic School','cube',5,2,7]];
const VIBES=[['any','Either'],['adv','Not scary'],['dark','Scary'],['cube','Escape Cubes']];
const S={step:1,day:5,players:6,vibe:'any',room:null,time:null,pay:'deposit'};
const PRICE=37.99, HST=0.13, DEPOSIT_PLAYERS=2;
const money=n=>'$'+n.toFixed(2);
const set=p=>{Object.assign(S,p);render();};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const d=DAYS[S.day], sub=S.players*PRICE, tax=sub*HST, total=sub+tax, deposit=DEPOSIT_PLAYERS*PRICE*(1+HST), balance=total-deposit, dueNow=S.pay==='full'?total:deposit;
  const col=n=>S.step===n?'#C9B3FF':(S.step>n?'#8FC7A4':'#A79FBA');
  document.getElementById('steps').innerHTML=[[1,'Pick a time'],[2,'Your details'],[3,'Confirmed']].map(([n,l])=>`<li ${S.step===n?'aria-current="step"':''} style="display: flex; align-items: center; gap: 8px; color: ${col(n)}"><span class="mono" style="width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid ${col(n)}; display: inline-flex; align-items: center; justify-content: center; font-size: 12px">${n}</span>${l}</li>`).join('');
  const M=document.getElementById('main');
  if(S.step===1){
    const weekday=S.day>=1&&S.day<=4;
    const fits=r=>S.players>=r[4]&&S.players<=r[5], byV=r=>S.vibe==='any'||r[2]===S.vibe;
    const list=ROOMS.filter(r=>fits(r)&&byV(r));
    const rooms=list.map((r,ri)=>{const v=V[r[2]];
      const open=TIMES.map((t,ti)=>({t,ti})).filter(o=>(weekday?o.ti>=1:true)&&((o.ti*7+ri*3+S.day*5)%4!==0)).slice(0,5);
      const slots=open.map(o=>{const on=S.room===r[1]&&S.time===o.t;return `<button type="button" class="lamp ${on?'on':'off'}" aria-pressed="${on}" aria-label="${esc(r[1])} at ${o.t}" data-room="${esc(r[1])}" data-time="${o.t}">${o.t}</button>`}).join('');
      return `<div style="background: #16131D; border: 1px solid #372F47; border-radius: 12px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 18px">
<div style="flex: 1 1 210px; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span class="lbl" style="letter-spacing: 0.1em">ROTOR ${v[0]} · No.${r[0]}</span><span class="disp" style="font-size: 28px; line-height: 1">${r[1]}</span>
<span style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 14px; color: #CEC6DD"><span class="mono" style="font-size: 12px; padding: 3px 7px; border-radius: 4px; background: ${v[2]}; color: ${v[3]}">${v[1]}</span>${r[3]}/5 ${W[r[3]]} · fits ${r[4]}–${r[5]}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">${slots}</div></div>`}).join('');
    const small=ROOMS.filter(r=>byV(r)&&!fits(r)).map(r=>`<div style="border: 1px dashed #372F47; border-radius: 12px; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: #A79FBA; font-size: 15px"><span><b style="color: #CEC6DD">${r[1]}</b> fits ${r[4]}–${r[5]} players</span><span>Not shown for a group of ${S.players}</span></div>`).join('');
    M.innerHTML=`<h1 class="disp" style="margin: 0 0 22px; font-size: 50px; line-height: 0.95">When are you free, and how many are coming?</h1>
<div style="display: flex; flex-wrap: wrap; gap: 22px 32px; align-items: flex-end; padding-bottom: 24px; border-bottom: 1px solid #2A2436">
<div role="group" aria-label="Date" style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">DATE</span><div style="display: flex; flex-wrap: wrap; gap: 6px">${DAYS.map((x,i)=>`<button type="button" class="key day ${S.day===i?'on':'off'}" aria-pressed="${S.day===i}" data-day="${i}"><span ${S.day===i?'':'style="color: #A79FBA"'}>${x[0]}</span><b>${x[1]}</b></button>`).join('')}</div></div>
<div role="group" aria-label="Players" style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">PLAYERS</span>
<div style="display: flex; align-items: center; gap: 6px; background: #1F1A29; border: 1px solid #372F47; border-radius: 8px; padding: 5px">
<button type="button" id="minus" aria-label="One fewer player" style="width: 48px; height: 54px; border: 0; border-radius: 6px; background: #2A2436; color: #F1ECF8; font-size: 24px; cursor: pointer">−</button>
<span style="width: 92px; height: 54px; border-radius: 6px; background: #0D0B12; border: 1px solid #372F47; display: flex; align-items: center; justify-content: center; gap: 10px"><span aria-hidden="true" class="mono" style="font-size: 13px; color: #5C536F">${S.players>2?S.players-1:''}</span><b aria-live="polite" style="font: 800 32px 'Big Shoulders Display','Oswald',sans-serif; color: #C9B3FF">${S.players}</b><span aria-hidden="true" class="mono" style="font-size: 13px; color: #5C536F">${S.players<10?S.players+1:''}</span></span>
<button type="button" id="plus" aria-label="One more player" style="width: 48px; height: 54px; border: 0; border-radius: 6px; background: #2A2436; color: #F1ECF8; font-size: 24px; cursor: pointer">+</button></div></div>
<div role="group" aria-label="Scary or not" style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">SCARY?</span><div style="display: flex; flex-wrap: wrap; gap: 6px">${VIBES.map(([id,l])=>`<button type="button" class="key chip ${S.vibe===id?'on':'off'}" aria-pressed="${S.vibe===id}" data-vibe="${id}">${l}</button>`).join('')}</div></div>
</div>
<p aria-live="polite" style="margin: 20px 0 14px; color: #CEC6DD">${list.length} rooms have open times on ${d[0]}, Nov ${d[1]} for a group of ${S.players}.</p>
<div style="display: flex; flex-direction: column; gap: 12px">${rooms}${small}</div>`;
    M.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>set({day:+b.dataset.day,room:null,time:null}));
    M.querySelectorAll('[data-vibe]').forEach(b=>b.onclick=()=>set({vibe:b.dataset.vibe,room:null,time:null}));
    M.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>set({room:b.dataset.room,time:b.dataset.time}));
    M.querySelector('#minus').onclick=()=>set({players:Math.max(2,S.players-1),room:null,time:null});
    M.querySelector('#plus').onclick=()=>set({players:Math.min(10,S.players+1),room:null,time:null});
  } else if(S.step===2){
    M.innerHTML=`<a href="#" id="back" style="font-size: 15px; font-weight: 600">← Change room or time</a>
<h1 class="disp" style="margin: 14px 0 24px; font-size: 50px; line-height: 0.95">Who should we expect?</h1>
<form id="details" aria-label="Your details" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 660px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #CEC6DD">Full name<input type="text" autocomplete="off" placeholder="Your name"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #CEC6DD">Mobile number<input type="tel" autocomplete="off" placeholder="416-555-0142"></label>
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: #CEC6DD">Email for your confirmation<input type="email" autocomplete="off" placeholder="you@example.com"></label>
<p style="grid-column: 1 / -1; margin: 0; font-size: 14px; color: #A79FBA">Prototype only: nothing you type here is sent or stored.</p>
<fieldset style="grid-column: 1 / -1; border: 0; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 10px"><legend style="font-size: 15px; color: #CEC6DD; margin-bottom: 6px">Payment</legend>
<p style="margin: 0 0 4px; font-size: 15px; color: #A79FBA">Online bookings need a deposit for 2 players to hold the room. Because groups often change size on the day, you settle the rest for however many people actually play.</p>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid ${S.pay==='deposit'?'#C9B3FF':'#4A4060'}; border-radius: 10px; background: #16131D; cursor: pointer"><input type="radio" name="pay" value="deposit" ${S.pay==='deposit'?'checked':''} style="width: 20px; height: 20px; margin-top: 2px; accent-color: #7445F5"><span style="flex: 1 1 auto"><span style="display: flex; justify-content: space-between; gap: 12px"><b>Pay the deposit now, the rest later</b><b>${money(deposit)}</b></span><span style="color: #A79FBA; font-size: 15px">Covers 2 players with tax. The remaining ${money(balance)} for ${S.players} players can be paid online before your visit or at the front desk, adjusted if your group changes.</span></span></label>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border: 1px solid ${S.pay==='full'?'#C9B3FF':'#4A4060'}; border-radius: 10px; background: #16131D; cursor: pointer"><input type="radio" name="pay" value="full" ${S.pay==='full'?'checked':''} style="width: 20px; height: 20px; margin-top: 2px; accent-color: #7445F5"><span style="flex: 1 1 auto"><span style="display: flex; justify-content: space-between; gap: 12px"><b>Pay the full amount now</b><b>${money(total)}</b></span><span style="color: #A79FBA; font-size: 15px">Skip the payment step at check-in. If someone drops out or joins, we'll refund or charge the difference at the desk.</span></span></label></fieldset>
<p style="grid-column: 1 / -1; margin: 0; font-size: 14px; color: #A79FBA">Card details are entered on the booking system's secure checkout, which this prototype doesn't include.</p>
<button type="submit" class="btn" style="grid-column: 1 / -1; justify-self: start; margin-top: 8px">Pay ${money(dueNow)} and confirm</button></form>`;
    M.querySelector('#back').onclick=e=>{e.preventDefault();set({step:1});};
    M.querySelector('#details').onsubmit=e=>{e.preventDefault();set({step:3});};
    M.querySelectorAll('input[name=pay]').forEach(r=>r.onchange=()=>set({pay:r.value}));
  } else {
    M.innerHTML=`<div style="max-width: 660px; display: flex; flex-direction: column; gap: 18px">
<p aria-hidden="true" class="mono" style="margin: 0; font-size: 14px; letter-spacing: 0.3em; color: #C9B3FF">PBASVEZRQ → CONFIRMED</p>
<h1 class="disp" style="margin: 0; font-size: 60px; line-height: 0.95">You're booked into ${esc(S.room)}.</h1>
<p style="margin: 0; color: #CEC6DD; font-size: 18px">In the real site, a confirmation email would go out now, asking you to arrive 10 minutes before ${esc(S.time)} so your game master can brief everyone before the clock starts. ${S.pay==='full'?`You'd have paid the full ${money(total)}, adjusted at the desk if your group size changes.`:`You'd have paid a ${money(deposit)} deposit, with the remaining ${money(balance)} for ${S.players} players payable online beforehand or at the front desk.`}</p>
<p style="margin: 0; padding: 14px 16px; border-radius: 8px; background: #1F1A29; color: #CEC6DD; font-size: 15px">This is a design prototype, so no booking was made. To play for real, book at <a href="https://www.enigmaroom.ca">enigmaroom.ca</a>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px"><a href="index.html" class="btn">Back to the homepage</a><a href="#" id="restart" style="padding: 0 10px; font-weight: 600; min-height: 52px; display: inline-flex; align-items: center">Start over</a></div></div>`;
    M.querySelector('#restart').onclick=e=>{e.preventDefault();set({step:1,room:null,time:null});};
  }
  const A=document.getElementById('aside');
  A.innerHTML=`<div class="lbl" style="background: #1F1A29; border-bottom: 1px solid #372F47; padding: 14px 22px; letter-spacing: 0.14em">YOUR BOOKING</div>
<div style="padding: 22px; display: flex; flex-direction: column; gap: 14px">
<span class="disp" style="font-size: 30px; line-height: 1">${esc(S.room||'Pick a room')}</span>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 16px">
<dt style="color: #A79FBA">When</dt><dd style="margin: 0; text-align: right">${d[0]}, Nov ${d[1]}${S.time?' · '+S.time:''}</dd>
<dt style="color: #A79FBA">Players</dt><dd style="margin: 0; text-align: right">${S.players} × $37.99</dd>
<dt style="color: #A79FBA">Subtotal</dt><dd style="margin: 0; text-align: right">$${sub.toFixed(2)}</dd>
<dt style="color: #A79FBA">HST 13%</dt><dd style="margin: 0; text-align: right">$${tax.toFixed(2)}</dd></dl>
<div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed #4A4060; padding-top: 14px"><span style="font-weight: 600">Total</span><span class="disp" style="font-size: 36px; line-height: 1">${money(total)}</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 14px; border-radius: 8px; background: #1F1A29"><span><b>Due today</b><br><span style="font-size: 13px; color: #A79FBA">${S.pay==='full'?'Full amount':'Deposit for 2 players'}</span></span><b style="font-size: 20px; color: #C9B3FF">${money(dueNow)}</b></div>
${S.pay==='full'?'':`<p style="margin: 0; font-size: 14px; color: #A79FBA">The remaining ${money(balance)} is paid online or at the front desk, for however many people actually play.</p>`}
${S.step===1&&S.time?'<button type="button" id="next" class="btn">Continue</button>':''}
${S.step===1&&!S.time?'<p style="margin: 0; padding: 14px; border-radius: 8px; background: #1F1A29; color: #CEC6DD; font-size: 15px">Tap a time to light it up, then continue.</p>':''}
<ul style="margin: 2px 0 0; padding: 0 0 0 18px; color: #A79FBA; font-size: 14px; display: flex; flex-direction: column; gap: 6px"><li>The room is private to your group.</li><li>Full refund if you cancel 48+ hours before.</li><li>Extra players can be added at check-in.</li></ul></div>`;
  const n=A.querySelector('#next'); if(n) n.onclick=()=>{set({step:2});window.scrollTo({top:0,behavior:'smooth'});};
}
render();
</script>
</body>
</html>
